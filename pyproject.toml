[project]
name = "realestate"
version = "0.1.0"
description = "A Real Estate ML/AI/LLM/RAG/Agent project"
authors = [
    {name = "eric-castellanos",email = "ericcastellanos229@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
packages = [{ include = "realestate", from = "src" }]

[tool.poetry.group.data-collection.dependencies]
dvc = "^3.0.0"
requests = "^2.0.0"
homeharvest = "^0.8.18"
pandas = "^2.3.3"
pyarrow = "^19.0.0"
geopandas = {version = "^1.1.3", python = ">=3.11,<3.13"}
osmnx = {version = "^2.1.0", python = ">=3.11,<3.13"}

[tool.poetry.group.eda.dependencies]
ydata-profiling = "^4.16.1"
pandas = "^2.3.3"
pyarrow = "^19.0.0"
setuptools = "^70.0.0"

[tool.poetry.group.modeling.dependencies]
pandas = "^2.3.3"
pyarrow = "^19.0.0"
numpy = "^2.2.0"
scikit-learn = "^1.6.0"
xgboost = "^2.1.0"
torch = "^2.6.0"
mlflow = "^2.18.0"
joblib = "^1.4.0"
matplotlib = "^3.10.0"
shap = "^0.46.0"
